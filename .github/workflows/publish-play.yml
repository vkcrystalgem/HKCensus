name: Build and publish Google Play
run-name: Play ${{ inputs.version_name }} · ${{ inputs.track }}

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        type: choice
        options:
          - internal
          - beta
          - production
        default: internal
        required: true
      version_name:
        description: User-visible Android version
        type: string
        default: '1.0.1'
        required: true
      version_code:
        description: Optional version code; blank chooses the next unused Play code
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: google-play-com-vkcrystalgem-hkcensus
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      RELEASE_TRACK: ${{ inputs.track }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      EXPECTED_UPLOAD_CERT_SHA1: 7E:DA:51:3A:97:1B:D1:2C:DA:78:9C:B2:5A:D2:BC:FC:DD:F3:26:81

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: android/.nvmrc
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/package-lock.json
            android/app.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: android/requirements-publish.txt
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
          "HKCENSUS_JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Install locked app dependencies
        working-directory: android
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
      - name: Install Play API dependencies
        run: python -m pip install -r android/requirements-publish.txt
      - name: Check committed app and release logic
        working-directory: android
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'App tests failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript checking failed.' }
          python -m unittest discover -s scripts -p 'test_*play.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release checks failed.' }

      - name: Restore encrypted release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64) -or [string]::IsNullOrWhiteSpace($env:PLAY_JSON)) {
            throw 'Required Android keystore or Play service-account secret is missing.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'hkcensus-upload.keystore'
          $playJson = Join-Path $env:RUNNER_TEMP 'hkcensus-play.json'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          [IO.File]::WriteAllText($playJson, $env:PLAY_JSON, [Text.UTF8Encoding]::new($false))
          "HKCENSUS_KEYSTORE_FILE=$keystore" >> $env:GITHUB_ENV
          "HKCENSUS_PLAY_SERVICE_ACCOUNT_JSON=$playJson" >> $env:GITHUB_ENV

      - name: Verify registered upload key
        env:
          HKCENSUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HKCENSUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $certificate = & "$env:JAVA_HOME/bin/keytool.exe" -list -v -keystore $env:HKCENSUS_KEYSTORE_FILE -alias $env:HKCENSUS_KEY_ALIAS -storepass:env HKCENSUS_KEYSTORE_PASSWORD 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Could not load the configured upload key.' }
          if (($certificate | Out-String) -notmatch [regex]::Escape($env:EXPECTED_UPLOAD_CERT_SHA1)) {
            throw 'Signing certificate does not match the registered Google Play upload key.'
          }
          Write-Output 'Registered upload certificate verified.'

      - name: Select unused Play version code
        id: release
        run: |
          python android/scripts/ci_play.py plan --track $env:RELEASE_TRACK
          if ($LASTEXITCODE -ne 0) { throw 'Release planning failed.' }

      - name: Prepare Android project and verified Gradle distribution
        run: |
          $ProgressPreference = 'SilentlyContinue'
          & ./android/scripts/use-node.ps1 prebuild-android
          if ($LASTEXITCODE -ne 0) { throw 'Android prebuild failed.' }
          # Use the official release API to avoid the failing web-download redirect.
          $gradleZip = Join-Path $env:RUNNER_TEMP 'gradle-8.14.3-bin.zip'
          $digest = 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/269969095' -Headers @{ Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' } -OutFile $gradleZip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash -LiteralPath $gradleZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
            throw 'Gradle archive differs from the officially published SHA-256 checksum.'
          }
          $wrapperPath = Join-Path $env:GITHUB_WORKSPACE 'android/android/gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content -LiteralPath $wrapperPath -Raw
          if ($wrapper -notmatch 'gradle-8\.14\.3-bin\.zip') { throw 'Update the verified Gradle distribution for this Expo template.' }
          $localUrl = ([Uri]::new($gradleZip)).AbsoluteUri
          $wrapper = [regex]::Replace($wrapper, '(?m)^distributionUrl=.*$', "distributionUrl=$localUrl")
          if ($wrapper -match '(?m)^distributionSha256Sum=') {
            $wrapper = [regex]::Replace($wrapper, '(?m)^distributionSha256Sum=.*$', "distributionSha256Sum=$digest")
          } else {
            $wrapper += "`ndistributionSha256Sum=$digest`n"
          }
          [IO.File]::WriteAllText($wrapperPath, $wrapper, [Text.UTF8Encoding]::new($false))
          Write-Output 'Official Gradle distribution downloaded and checksum verified.'

      - name: Build signed APK and AAB on GitHub
        env:
          HKCENSUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HKCENSUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HKCENSUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          & ./android/scripts/build-release.ps1 -SkipPrebuild -VersionCode $env:VERSION_CODE -VersionName $env:VERSION_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Signed release build failed.' }

      - name: Verify built version and target Android SDK
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          $apk = Join-Path $env:GITHUB_WORKSPACE 'android/android/app/build/outputs/apk/release/app-release.apk'
          $aapt = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/aapt.exe'
          $metadata = (& $aapt dump badging $apk | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the built Android manifest.' }
          if ($metadata -notmatch "package: name='com\.vkcrystalgem\.hkcensus'") { throw 'Built Android package differs from the Play app.' }
          if ($metadata -notmatch "targetSdkVersion:'36'") { throw 'Built artifact must target Android API 36.' }
          if ($metadata -notmatch "versionCode='$env:VERSION_CODE'" -or $metadata -notmatch "versionName='$([regex]::Escape($env:VERSION_NAME))'") {
            throw 'Built artifact version differs from the release plan.'
          }
          Write-Output "Verified target API 36 and version $env:VERSION_NAME ($env:VERSION_CODE)."

      - name: Publish GitHub-built bundle to Play
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          $aab = Join-Path $env:GITHUB_WORKSPACE 'android/android/app/build/outputs/bundle/release/app-release.aab'
          python android/scripts/publish_play.py --package-name com.vkcrystalgem.hkcensus --aab $aab --track $env:RELEASE_TRACK --release-status completed --release-name "HK Census $env:VERSION_NAME ($env:VERSION_CODE)" --release-notes-file release-out/release-notes.en-US.txt --release-notes-language en-US --receipt-json release-out/play-upload.json
          if ($LASTEXITCODE -ne 0) { throw 'Google Play publication failed.' }

      - name: Verify completed Play release and bundle checksum
        env:
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          python android/scripts/ci_play.py verify --track $env:RELEASE_TRACK --aab android/android/app/build/outputs/bundle/release/app-release.aab
          if ($LASTEXITCODE -ne 0) { throw 'Play verification failed.' }

      - name: Save signed builds and sanitized Play receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hkcensus-${{ inputs.version_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/android/app/build/outputs/apk/release/app-release.apk
            android/android/app/build/outputs/bundle/release/app-release.aab
            release-out/*.json
            release-out/release-notes.en-US.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary credentials
        if: always()
        run: |
          foreach ($name in @('hkcensus-upload.keystore', 'hkcensus-play.json')) {
            $credentialPath = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $credentialPath) { Remove-Item -LiteralPath $credentialPath -Force }
          }
